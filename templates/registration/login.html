<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #e8ecf5; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(420px, calc(100% - 40px)); padding: 32px; border: 1px solid #27324a; border-radius: 16px; background: #121a2b; }
    h1 { margin-top: 0; }
    p, label { color: #aab4ca; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 8px; }
    input { padding: 12px; border: 1px solid #35425e; border-radius: 8px; background: #0b1020; color: #e8ecf5; font: inherit; }
    button { padding: 13px; border: 0; border-radius: 9px; background: #7dd3fc; color: #07111e; font: inherit; font-weight: 700; cursor: pointer; }
    .error { color: #f6d98c; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>Log in</h1>
    <p>Sign in to view your portfolio and manage spot orders.</p>
    {% if form.errors %}
      <p class="error" role="alert">The username or password is incorrect. Please try again.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Log in</button>
    </form>
    {% if allow_signups %}
      <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a>.</p>
    {% endif %}
    <p><a href="/">Back to coin search</a></p>
  </main>
</body>
</html>
