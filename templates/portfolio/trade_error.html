<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade not completed</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #e8ecf5; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(560px, calc(100% - 40px)); padding: 32px; border: 1px solid #725b2b; border-radius: 16px; background: #211d13; }
    p { color: #f6d98c; line-height: 1.5; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>Trade not completed</h1>
    <p role="alert">{{ error }}</p>
    <a href="/portfolio/">Return to portfolio</a>
  </main>
</body>
</html>
